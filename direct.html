<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Apontamento</title>

    <!-- Configurações PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apontamento" />
    <link rel="apple-touch-icon" href="icoapontamento.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Supabase JS Client Oficial -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Guardião de Autenticação Alinhado com o PWA -->
    <script>
        (function verificarAuth() {
            const matricula = localStorage.getItem("MatriculaUsuario") ||
                localStorage.getItem("UsuarioMatricula");
            if (!matricula || matricula.trim() === "" || matricula === "---") {
                window.location.replace("login.html");
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        /* 1. Trava a viewport para rolagem interna estável */
        html {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(135deg, #081426 0%, #020912 50%, #0A1D38 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            padding: calc(35px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom)) 20px;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* Banner de Alerta Flutuante (In-App Toast) */
        .direct-toast {
            position: fixed;
            top: calc(15px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            max-width: 460px;
            width: calc(100% - 40px);
            background-color: #1A3A68;
            border: 1px solid #00C48C;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
        }

            .direct-toast.show {
                transform: translateX(-50%) translateY(0);
            }

        .direct-toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .direct-toast-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .direct-toast-title {
            font-size: 13px;
            font-weight: 700;
            color: #00E5A3;
        }

        .direct-toast-body {
            font-size: 12px;
            color: #CAD8E8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 1. Topo: Botão Voltar e Título */
        .header-top {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            gap: 14px;
            flex-shrink: 0;
        }

        .btn-voltar {
            background-color: #0E223D;
            border: 1px solid #1F3A60;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #FFFFFF;
            font-size: 20px;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.12s ease;
            flex-shrink: 0;
        }

            .btn-voltar:active {
                transform: scale(0.95);
                background-color: #173763;
            }

        .header-titles {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

            .header-titles h1 {
                font-size: 20px;
                font-weight: 700;
                color: #FFFFFF;
                line-height: 1.2;
            }

            .header-titles p {
                font-size: 12px;
                color: #8FA3BF;
            }

        /* 2. Caixa de Nova Mensagem */
        .send-card {
            background-color: #0B1C33;
            border: 1px solid #173154;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .card-header-tag {
            font-size: 11px;
            font-weight: 700;
            color: #D1B3FF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 700;
            color: #CAD8E8;
        }

        .input-box {
            background-color: #061221;
            border: 1px solid #1B3352;
            border-radius: 8px;
            height: 40px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            position: relative;
            transition: border-color 0.2s ease;
        }

            .input-box:focus-within {
                border-color: #8A2BE2;
            }

            .input-box select {
                width: 100%;
                height: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 14px;
                cursor: pointer;
                appearance: none;
            }

                .input-box select option {
                    background-color: #061221;
                    color: #FFFFFF;
                }

        .aviso-todos-txt {
            font-size: 13px;
            color: #8FA3BF;
            margin: 2px 2px 4px 2px;
        }

        /* Área de Texto da Mensagem */
        .textarea-box {
            background-color: #061221;
            border: 1px solid #1B3352;
            border-radius: 8px;
            height: 70px;
            padding: 8px 10px;
            display: flex;
            transition: border-color 0.2s ease;
        }

            .textarea-box:focus-within {
                border-color: #8A2BE2;
            }

            .textarea-box textarea {
                width: 100%;
                height: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 15px;
                resize: none;
            }

                .textarea-box textarea::placeholder {
                    color: #475C75;
                }

        /* Botão Enviar Mensagem */
        .btn-enviar {
            background-color: #8A2BE2;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            height: 42px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }

            .btn-enviar:active {
                transform: scale(0.98);
                opacity: 0.9;
            }

            .btn-enviar:disabled {
                background-color: #4B2078;
                cursor: not-allowed;
                opacity: 0.6;
            }

        /* 3. Título da Lista */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 4px 8px 4px;
            flex-shrink: 0;
        }

        .list-title {
            font-size: 12px;
            font-weight: 700;
            color: #8FA3BF;
            letter-spacing: 0.3px;
        }

        .btn-refresh {
            background: transparent;
            border: none;
            color: #8A2BE2;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 4. Lista de Mensagens com Rolagem Habilitada */
        .messages-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 24px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .msg-card {
            background-color: #0D2542;
            border: 1px solid #17365D;
            border-radius: 14px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .msg-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .remetente-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .remetente-nome-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .label-de {
            font-size: 12px;
            color: #8FA3BF;
        }

        .remetente-nome {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .msg-data {
            font-size: 11px;
            color: #5A718F;
        }

        .badge-destino {
            background-color: #1B3A63;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 700;
            color: #6CB8FF;
            white-space: nowrap;
        }

            .badge-destino.geral {
                background-color: #2E1B4E;
                color: #D1B3FF;
            }

        .msg-divider {
            height: 1px;
            background-color: #132D4E;
        }

        .msg-conteudo {
            font-size: 15px;
            color: #CAD8E8;
            line-height: 1.35;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Empty State */
        .empty-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            gap: 8px;
            text-align: center;
            color: #8FA3BF;
        }

            .empty-view .icon {
                font-size: 36px;
            }

            .empty-view p {
                font-size: 14px;
            }

        .hidden {
            display: none !important;
        }

        /* =========================================================================
           MODAL DE ALERTA PERSONALIZADO
           ========================================================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 9, 18, 0.78);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 24px;
        }

        .modal-card {
            background-color: #0B1C33;
            border: 1px solid #1B3352;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
            animation: modalFadeIn 0.18s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 2px;
        }

            .modal-icon-badge.success {
                background-color: rgba(0, 196, 140, 0.15);
                border: 1px solid #00C48C;
            }

            .modal-icon-badge.error {
                background-color: rgba(255, 59, 48, 0.15);
                border: 1px solid #FF3B30;
            }

            .modal-icon-badge.warning {
                background-color: rgba(255, 152, 56, 0.15);
                border: 1px solid #FF9838;
            }

        .modal-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.2;
        }

        .modal-card p {
            font-size: 13px;
            color: #CAD8E8;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .modal-buttons-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
        }

        .modal-btn {
            flex: 1;
            height: 48px;
            border-radius: 12px;
            border: none;
            background-color: #8A2BE2;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

            .modal-btn:active {
                transform: scale(0.97);
            }
    </style>
</head>
<body>

    <!-- Banner Toast Flutuante com Título Fixo "Apontamento" -->
    <div id="toastNotificacao" class="direct-toast">
        <span class="direct-toast-icon">💬</span>
        <div class="direct-toast-content">
            <span id="toastTitulo" class="direct-toast-title">Apontamento</span>
            <span id="toastCorpo" class="direct-toast-body">Conteúdo</span>
        </div>
    </div>

    <div class="container">

        <!-- 1. Topo: Botão Voltar e Título -->
        <header class="header-top">
            <button type="button" class="btn-voltar" onclick="onVoltarTapped()" title="Voltar">←</button>
            <div class="header-titles">
                <h1>Direct & Avisos</h1>
                <p>Mensagens gerais, por grupo ou individuais</p>
            </div>
        </header>

        <!-- 2. Caixa de Nova Mensagem -->
        <section class="send-card">
            <span class="card-header-tag">ENVIAR MENSAGEM</span>

            <!-- CAMPO 1: Tipo de Destino -->
            <div class="form-group">
                <label class="form-label">Enviar para:</label>
                <div class="input-box">
                    <select id="pkrTipoDestino" onchange="onTipoDestinoChanged()">
                        <option value="0" selected>Todos (Aviso Geral)</option>
                        <option value="1">Grupo</option>
                        <option value="2">Usuário Individual</option>
                    </select>
                </div>
            </div>

            <!-- CAMPO 2: Destino Específico -->
            <div class="form-group">
                <label class="form-label" id="lblTituloAlvo">Público:</label>

                <!-- Opção A: Todos -->
                <p class="aviso-todos-txt" id="lblTodosAviso">Todos receberão este aviso</p>

                <!-- Opção B: Grupo -->
                <div class="input-box hidden" id="borderPickerGrupo">
                    <select id="pkrAlvoGrupo">
                        <option value="" disabled selected hidden>Selecione o Grupo</option>
                        <option value="Caldeiraria">Caldeiraria</option>
                        <option value="Mecânica">Mecânica</option>
                        <option value="Mantenedor">Mantenedor</option>
                    </select>
                </div>

                <!-- Opção C: Usuário Individual -->
                <div class="input-box hidden" id="borderPickerUsuario">
                    <select id="pkrAlvoUsuario">
                        <option value="" disabled selected hidden>Selecione o Usuário</option>
                    </select>
                </div>
            </div>

            <!-- CAMPO 3: Mensagem -->
            <div class="textarea-box">
                <textarea id="txtMensagem"
                          placeholder="Digite seu recado ou aviso aqui..."
                          spellcheck="false"></textarea>
            </div>

            <!-- Botão Enviar -->
            <button type="button" id="btnEnviar" class="btn-enviar" onclick="onEnviarMensagemClicked()">
                <span>✈️</span>
                <span>Enviar Mensagem</span>
            </button>
        </section>

        <!-- 3. Título da Lista -->
        <div class="list-header">
            <span class="list-title">MENSAGENS RECEBIDAS & ENVIADAS</span>
            <button class="btn-refresh" onclick="carregarMensagensAsync()">Atualizar ↻</button>
        </div>

        <!-- 4. Lista de Mensagens com Rolagem Habilitada -->
        <main class="messages-list" id="listaMensagens">
            <!-- Renderizado dinamicamente -->
        </main>

        <!-- View Vazia -->
        <div class="empty-view" id="emptyView">
            <span class="icon">💬</span>
            <p>Nenhuma mensagem encontrada</p>
        </div>

    </div>

    <!-- Modal Customizado de Alerta -->
    <div id="modalAviso" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcone" class="modal-icon-badge warning">⚠️</div>
            <h3 id="modalTitulo">Atenção</h3>
            <p id="modalMensagem">Mensagem informativa...</p>
            <div class="modal-buttons-row">
                <button id="btnModalOk" class="modal-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 0. DIÁLOGOS CUSTOMIZADOS
        // =========================================================================
        function exibirAviso(titulo, mensagem, tipo = 'warning') {
            return new Promise((resolve) => {
                const modal = document.getElementById('modalAviso');
                const lblTitulo = document.getElementById('modalTitulo');
                const lblMensagem = document.getElementById('modalMensagem');
                const icone = document.getElementById('modalIcone');
                const btnOk = document.getElementById('btnModalOk');

                lblTitulo.textContent = titulo;
                lblMensagem.textContent = mensagem;

                if (tipo === 'success') {
                    icone.className = 'modal-icon-badge success';
                    icone.textContent = '✓';
                    btnOk.style.backgroundColor = '#00C48C';
                    btnOk.style.color = '#020912';
                } else if (tipo === 'error') {
                    icone.className = 'modal-icon-badge error';
                    icone.textContent = '✕';
                    btnOk.style.backgroundColor = '#FF3B30';
                    btnOk.style.color = '#FFFFFF';
                } else {
                    icone.className = 'modal-icon-badge warning';
                    icone.textContent = '⚠️️';
                    btnOk.style.backgroundColor = '#8A2BE2';
                    btnOk.style.color = '#FFFFFF';
                }

                modal.style.display = 'flex';

                btnOk.onclick = () => {
                    modal.style.display = 'none';
                    resolve();
                };
            });
        }

        // =========================================================================
        // 1. CONFIGURAÇÕES SUPABASE
        // =========================================================================
        const SUPABASE_URL = "https://mtlbrhmpiwvzjwbzaywi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qilTaEWSiDNr1L-N5uE5gA_NYyLkyBt";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let _listaUsuarios = [];
        let _minhaMatricula = "";
        let _meuNome = "";
        let _meuGrupo = "";
        let _nivelUsuario = "";
        let _ehAdministrador = false;
        let isSending = false;
        let audioContextDesbloqueado = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosSessaoAsync();
            await carregarUsuariosParaPickerAsync();
            await carregarMensagensAsync();
            inscreverRealtimeMensagens();

            // Interação única para autorizar notificações e áudio no mobile
            document.body.addEventListener('click', () => {
                solicitarPermissaoNotificacao();
                desbloquearAudio();
            }, { once: true });
        });

        function desbloquearAudio() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx && !audioContextDesbloqueado) {
                    audioContextDesbloqueado = new AudioCtx();
                }
                if (audioContextDesbloqueado && audioContextDesbloqueado.state === 'suspended') {
                    audioContextDesbloqueado.resume();
                }
            } catch (_) { }
        }

        async function solicitarPermissaoNotificacao() {
            if ("Notification" in window && Notification.permission === "default") {
                try {
                    await Notification.requestPermission();
                } catch (_) { }
            }
        }

        // 1. Carrega dados de identificação e perfil
        async function carregarDadosSessaoAsync() {
            _minhaMatricula = (localStorage.getItem("MatriculaUsuario") ||
                localStorage.getItem("UsuarioMatricula") || "").trim();

            _meuGrupo = (localStorage.getItem("UsuarioGrupo") || "").trim();
            _nivelUsuario = (localStorage.getItem("UsuarioNivel") ||
                localStorage.getItem("NivelUsuario") || "").trim();
            _meuNome = (localStorage.getItem("UsuarioNome") || "").trim();

            if (_minhaMatricula) {
                try {
                    const { data, error } = await supabaseClient
                        .from('usuarios')
                        .select('matricula, nome, grupo, nivel')
                        .ilike('matricula', _minhaMatricula)
                        .limit(1);

                    if (!error && data && data.length > 0) {
                        const u = data[0];
                        if (u.nome) _meuNome = String(u.nome).trim();
                        if (u.grupo) _meuGrupo = String(u.grupo).trim();
                        if (u.nivel) _nivelUsuario = String(u.nivel).trim();

                        localStorage.setItem("UsuarioNome", _meuNome);
                        localStorage.setItem("UsuarioGrupo", _meuGrupo);
                        localStorage.setItem("UsuarioNivel", _nivelUsuario);
                        localStorage.setItem("NivelUsuario", _nivelUsuario);
                    }
                } catch (err) {
                    console.warn("Validação remota ignorada:", err);
                }
            }

            const nivelLimpo = _nivelUsuario.toLowerCase();
            const grupoLimpo = _meuGrupo.toLowerCase();

            _ehAdministrador = nivelLimpo === "administrador" ||
                nivelLimpo === "admin" ||
                nivelLimpo === "1" ||
                grupoLimpo === "administrador" ||
                grupoLimpo === "admin";
        }

        // 2. Preenche lista de usuários para seleção
        async function carregarUsuariosParaPickerAsync() {
            try {
                const { data, error } = await supabaseClient
                    .from('usuarios')
                    .select('matricula, nome')
                    .order('nome', { ascending: true });

                if (!error && data) {
                    _listaUsuarios = data.filter(u =>
                        u.matricula &&
                        String(u.matricula).trim().toLowerCase() !== _minhaMatricula.toLowerCase()
                    );

                    const select = document.getElementById('pkrAlvoUsuario');
                    select.innerHTML = '<option value="" disabled selected hidden>Selecione o Usuário</option>';

                    _listaUsuarios.forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = String(u.matricula).trim();
                        opt.textContent = `${u.nome || u.matricula} (${u.matricula})`;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.warn("Falha ao listar usuários:", e);
            }
        }

        function formatarDataHora(dataString) {
            if (!dataString) return "";
            try {
                const d = new Date(dataString);
                if (isNaN(d.getTime())) return dataString;

                const dia = String(d.getDate()).padStart(2, '0');
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const ano = d.getFullYear();
                const horas = String(d.getHours()).padStart(2, '0');
                const minutos = String(d.getMinutes()).padStart(2, '0');

                return `${dia}/${mes}/${ano} ${horas}:${minutos}`;
            } catch (_) {
                return dataString;
            }
        }

        // Atualiza o maior ID visto pelo usuário para sincronizar com o badge do index.html
        function marcarMensagensComoLidas(mensagens) {
            if (!mensagens || mensagens.length === 0) return;

            let maiorId = parseInt(localStorage.getItem("UltimoIdDirectLido") || "0", 10);

            mensagens.forEach(m => {
                const idNum = parseInt(m.id, 10);
                if (idNum > maiorId) {
                    maiorId = idNum;
                }
            });

            localStorage.setItem("UltimoIdDirectLido", String(maiorId));
        }

        // 3. Consulta mensagens usando a função segura criada no banco (RPC)
        async function carregarMensagensAsync() {
            try {
                const minhaMat = _minhaMatricula || localStorage.getItem("MatriculaUsuario") || "";
                const meuGrp = _meuGrupo || localStorage.getItem("UsuarioGrupo") || "";

                if (!minhaMat) {
                    console.warn("Nenhuma matrícula ativa encontrada para consulta.");
                    return;
                }

                const { data, error } = await supabaseClient
                    .rpc('obter_mensagens_usuario', {
                        p_matricula: minhaMat,
                        p_grupo: meuGrp
                    });

                if (error) {
                    console.error("Erro retornado pelo RPC:", error);
                    throw error;
                }

                const msgs = data || [];
                marcarMensagensComoLidas(msgs);
                renderizarMensagens(msgs);
            } catch (ex) {
                console.error("Falha ao carregar mensagens via RPC:", ex);
            }
        }

        function renderizarMensagens(mensagens) {
            const container = document.getElementById('listaMensagens');
            const emptyView = document.getElementById('emptyView');

            if (!mensagens || mensagens.length === 0) {
                container.innerHTML = "";
                emptyView.style.display = "flex";
                return;
            }

            emptyView.style.display = "none";

            container.innerHTML = mensagens.map(msg => {
                const remetenteNome = msg.remetente_nome || msg.RemetenteNome || msg.remetente_matricula || "Desconhecido";
                const dataEnvio = formatarDataHora(msg.created_at || msg.CreatedAt);
                const conteudo = msg.conteudo || msg.Conteudo || "";
                const tipoDestino = String(msg.tipo_destino || msg.TipoDestino || "").toLowerCase().trim();
                const destinoBruto = String(msg.destino || msg.Destino || "TODOS").trim();

                let destinoExibicao = "";
                let isGeral = false;

                if (tipoDestino === "usuario") {
                    if (destinoBruto.toLowerCase() === _minhaMatricula.toLowerCase()) {
                        destinoExibicao = _meuNome || _minhaMatricula;
                    } else {
                        const userAlvo = _listaUsuarios.find(u =>
                            u.matricula && String(u.matricula).toLowerCase() === destinoBruto.toLowerCase()
                        );
                        destinoExibicao = userAlvo && userAlvo.nome ? userAlvo.nome : destinoBruto;
                    }
                } else {
                    destinoExibicao = destinoBruto.toUpperCase();
                    if (destinoExibicao === "TODOS") isGeral = true;
                }

                return `
                        <article class="msg-card">
                            <div class="msg-card-top">
                                <div class="remetente-box">
                                    <div class="remetente-nome-row">
                                        <span class="label-de">De:</span>
                                        <span class="remetente-nome">${remetenteNome}</span>
                                    </div>
                                    <span class="msg-data">${dataEnvio}</span>
                                </div>

                                <div class="badge-destino ${isGeral ? 'geral' : ''}">
                                    Para: ${destinoExibicao}
                                </div>
                            </div>

                            <div class="msg-divider"></div>

                            <div class="msg-conteudo">${escaparHtml(conteudo)}</div>
                        </article>
                    `;
            }).join('');
        }

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // 4. Troca dinâmica dos campos de envio
        function onTipoDestinoChanged() {
            const index = parseInt(document.getElementById('pkrTipoDestino').value, 10);
            const borderGrupo = document.getElementById('borderPickerGrupo');
            const borderUsuario = document.getElementById('borderPickerUsuario');
            const lblTodos = document.getElementById('lblTodosAviso');
            const lblTituloAlvo = document.getElementById('lblTituloAlvo');

            lblTodos.classList.toggle('hidden', index !== 0);
            borderGrupo.classList.toggle('hidden', index !== 1);
            borderUsuario.classList.toggle('hidden', index !== 2);

            switch (index) {
                case 1:
                    lblTituloAlvo.textContent = "Qual grupo?";
                    break;
                case 2:
                    lblTituloAlvo.textContent = "Qual usuário?";
                    break;
                default:
                    lblTituloAlvo.textContent = "Público:";
                    break;
            }
        }

        // 5. Envio de Nova Mensagem
        async function onEnviarMensagemClicked() {
            if (isSending) return;

            solicitarPermissaoNotificacao();
            desbloquearAudio();

            const txtMensagem = document.getElementById('txtMensagem');
            const texto = txtMensagem.value.trim();

            if (!texto) {
                await exibirAviso("Campo Obrigatório", "Digite o conteúdo da mensagem.", "warning");
                return;
            }

            if (!_meuNome) {
                await carregarDadosSessaoAsync();
            }

            const matriculaFinal = _minhaMatricula || localStorage.getItem("MatriculaUsuario") || "";
            const nomeFinal = _meuNome || localStorage.getItem("UsuarioNome") || matriculaFinal || "Usuário";

            if (!matriculaFinal) {
                await exibirAviso("Erro de Identificação", "Matrícula não identificada. Por favor, refaça o login.", "error");
                return;
            }

            const pkrTipo = parseInt(document.getElementById('pkrTipoDestino').value, 10);
            let tipoDestino = "todos";
            let alvoDestino = "TODOS";

            if (pkrTipo === 1) { // Grupo
                const selGrupo = document.getElementById('pkrAlvoGrupo').value;
                if (!selGrupo) {
                    await exibirAviso("Seleção Obrigatória", "Selecione o grupo de destino.", "warning");
                    return;
                }
                tipoDestino = "grupo";
                alvoDestino = selGrupo.trim();
            } else if (pkrTipo === 2) { // Usuário Individual
                const selUsuario = document.getElementById('pkrAlvoUsuario').value;
                if (!selUsuario) {
                    await exibirAviso("Seleção Obrigatória", "Selecione o usuário destinatário.", "warning");
                    return;
                }
                tipoDestino = "usuario";
                alvoDestino = selUsuario.trim();
            }

            const btnEnviar = document.getElementById('btnEnviar');
            btnEnviar.disabled = true;
            isSending = true;

            try {
                const novaMsg = {
                    remetente_matricula: matriculaFinal,
                    remetente_nome: nomeFinal,
                    tipo_destino: tipoDestino,
                    destino: alvoDestino,
                    conteudo: texto,
                    created_at: new Date().toISOString()
                };

                const { data, error } = await supabaseClient
                    .from('direct_mensagens')
                    .insert([novaMsg])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    marcarMensagensComoLidas(data);
                }

                txtMensagem.value = "";
                await carregarMensagensAsync();
            } catch (ex) {
                console.error("Erro ao enviar mensagem:", ex);
                await exibirAviso("Erro ao Enviar", `Falha ao enviar mensagem: ${ex.message || ex}`, "error");
            } finally {
                btnEnviar.disabled = false;
                isSending = false;
            }
        }

        // Toca bipe sonoro sintetizado nativo
        function tocarAlertaSonoro() {
            try {
                desbloquearAudio();
                const ctx = audioContextDesbloqueado || new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch (_) { }
        }

        // Exibe banner flutuante em tela com título "Apontamento"
        function exibirToastEmTela(titulo, corpo) {
            const toast = document.getElementById('toastNotificacao');
            const lblTit = document.getElementById('toastTitulo');
            const lblCor = document.getElementById('toastCorpo');

            if (!toast || !lblTit || !lblCor) return;

            lblTit.textContent = titulo;
            lblCor.textContent = corpo;

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4500);
        }

        // Dispara som, banner em tela e notificação do sistema com título fixo "Apontamento"
        async function dispararNotificacaoNativa(novaMsg) {
            if (!novaMsg) return;

            const remetenteMat = String(novaMsg.remetente_matricula || "").trim().toLowerCase();
            const remetenteNom = novaMsg.remetente_nome || "Usuário";
            const tipo = String(novaMsg.tipo_destino || "").toLowerCase().trim();
            const destino = String(novaMsg.destino || "").toLowerCase().trim();
            const conteudo = novaMsg.conteudo || "Você recebeu um novo aviso.";

            const minhaMat = (_minhaMatricula || localStorage.getItem("MatriculaUsuario") || "").trim().toLowerCase();
            const meuGrupo = (_meuGrupo || localStorage.getItem("UsuarioGrupo") || "").trim().toLowerCase();
            const meuNom = (_meuNome || localStorage.getItem("UsuarioNome") || "").trim().toLowerCase();

            // 1. Nunca notifica quem enviou
            if (minhaMat && remetenteMat === minhaMat) return;

            // 2. Avalia destinatário
            let devoReceber = false;
            if (tipo === "todos" || destino === "todos") devoReceber = true;
            if (tipo === "usuario" && (destino === minhaMat || destino === meuNom)) devoReceber = true;
            if (tipo === "grupo" && meuGrupo && destino === meuGrupo) devoReceber = true;

            if (!devoReceber) return;

            // Título unificado e fixo
            const tituloFixo = "Apontamento";
            const corpoFormatado = `${remetenteNom}: ${conteudo}`;

            // Som e banner na interface
            tocarAlertaSonoro();
            exibirToastEmTela(tituloFixo, corpoFormatado);

            // Vibração física
            if ("vibrate" in navigator) {
                try { navigator.vibrate([200, 100, 200]); } catch (_) { }
            }

            const opcoes = {
                body: corpoFormatado,
                icon: "icoapontamento.png",
                badge: "icoapontamento.png",
                vibrate: [200, 100, 200],
                tag: `msg-${novaMsg.id || Date.now()}`
            };

            // Notificação do sistema via Service Worker (PWA em segundo plano)
            if ("serviceWorker" in navigator) {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    if (reg && reg.showNotification) {
                        await reg.showNotification(tituloFixo, opcoes);
                        return;
                    }
                } catch (_) { }
            }

            // Fallback para notificação convencional da aba
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(tituloFixo, opcoes);
                } catch (_) { }
            }
        }

        // 6. Atualização em tempo real via Realtime com notificação imediata
        function inscreverRealtimeMensagens() {
            try {
                const canalNome = 'canal_direct_' + Date.now();
                supabaseClient
                    .channel(canalNome)
                    .on(
                        'postgres_changes',
                        { event: 'INSERT', schema: 'public', table: 'direct_mensagens' },
                        (payload) => {
                            if (payload && payload.new) {
                                dispararNotificacaoNativa(payload.new);
                            }
                            carregarMensagensAsync();
                        }
                    )
                    .on(
                        'postgres_changes',
                        { event: 'DELETE', schema: 'public', table: 'direct_mensagens' },
                        () => {
                            carregarMensagensAsync();
                        }
                    )
                    .subscribe((status) => {
                        console.log("Status Realtime Direct:", status);
                    });
            } catch (e) {
                console.warn("Realtime não inicializado:", e);
            }
        }

        function onVoltarTapped() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
