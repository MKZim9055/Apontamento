<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Apontamentos</title>

    <!-- Configurações PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apontamento" />
    <link rel="apple-touch-icon" href="icoapontamento.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Supabase JS Client Oficial e Banco Local IndexedDB -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db.js"></script>

    <!-- Guardião de Autenticação -->
    <script>
        (function verificarAuth() {
            const token = localStorage.getItem("auth_token");
            const matricula = localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula");
            if (!token || !matricula) {
                window.location.replace("login.html");
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input {
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #081426 0%, #020912 50%, #0A1D38 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            padding: calc(35px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom)) 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        /* 1. Topo: Voltar, Título e Ações */
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background-color: #0E223D;
            border: 1px solid #1F3A60;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #FFFFFF;
            font-size: 18px;
            transition: background 0.15s ease, transform 0.12s ease;
            flex-shrink: 0;
        }

            .action-btn:active {
                transform: scale(0.95);
                background-color: #173763;
            }

        .header-titles h1 {
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.2;
        }

        .header-titles p {
            font-size: 12px;
            color: #8FA3BF;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 2. Barra de Busca */
        .search-box {
            background-color: #0B1C33;
            border: 1px solid #173154;
            border-radius: 14px;
            height: 46px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: border-color 0.2s ease;
        }

            .search-box:focus-within {
                border-color: #00C48C;
            }

            .search-box input {
                width: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 13px;
            }

                .search-box input::placeholder {
                    color: #4B6382;
                }

        /* 3. Contador de Registros */
        .counter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 4px 8px 4px;
        }

        .counter-label {
            font-size: 11px;
            font-weight: 700;
            color: #8FA3BF;
        }

        .counter-value {
            font-size: 11px;
            font-weight: 700;
            color: #00C48C;
        }

        /* 4. Lista e Swipe View */
        .list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 90px;
            overscroll-behavior-y: contain;
        }

        .swipe-container {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background-color: #081426;
        }

        .swipe-actions {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 1;
        }

        .swipe-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            padding: 0 16px;
            transition: opacity 0.15s ease;
        }

            .swipe-btn:active {
                opacity: 0.8;
            }

        .btn-sync {
            background-color: #00C48C;
        }

        .btn-edit {
            background-color: #1F6FEB;
        }

        .btn-delete {
            background-color: #DA3633;
        }

        .item-card {
            position: relative;
            background-color: #0D2542;
            border: 1px solid #17365D;
            border-radius: 14px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
            touch-action: pan-y;
            will-change: transform;
            backface-visibility: hidden;
            cursor: grab;
            user-select: none;
        }

            .item-card:active {
                cursor: grabbing;
            }

        /* Linha 1 */
        .card-line-1 {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Bloco da OS e Status abaixo */
        .os-status-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        /* Bloco da Data e Setor abaixo */
        .meta-right-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .badge-os {
            background-color: #0B4242;
            border-radius: 6px;
            padding: 3px 8px;
            color: #00C48C;
            font-size: 15px;
            font-weight: 700;
            width: fit-content;
        }

        .badge-setor {
            background-color: #162E4A;
            border-radius: 6px;
            padding: 3px 8px;
            color: #CAD8E8;
            font-size: 14px;
            font-weight: 600;
            width: fit-content;
        }

        .badge-status {
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 14px;
            font-weight: 700;
            width: fit-content;
        }

            .badge-status.pendente {
                background-color: rgba(255, 152, 56, 0.15);
                color: #FF9838;
                border: 1px solid rgba(255, 152, 56, 0.3);
            }

            .badge-status.enviado {
                background-color: rgba(0, 196, 140, 0.15);
                color: #00C48C;
                border: 1px solid rgba(0, 196, 140, 0.3);
            }

        .data-text {
            font-size: 14px;
            font-weight: 700;
            color: #8FA3BF;
        }

        /* Divisor Interno Suave */
        .card-divider {
            height: 1px;
            background-color: #162E4E;
            margin: 2px 0;
        }

        /* Linha 2 */
        .card-line-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .matricula-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .matricula-label {
            font-size: 12px;
            color: #657D99;
        }

        .matricula-value {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .horarios-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .horarios-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .horario-text {
            font-size: 15px;
            font-weight: 700;
            color: #CAD8E8;
        }

        .ate-text {
            font-size: 12px;
            color: #657D99;
        }

        .badge-grupo {
            background-color: #1A314E;
            color: #49B0F3;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 14px;
            font-weight: 700;
            width: fit-content;
        }

        /* Linha 3: Observações */
        .card-obs {
            font-size: 14px;
            color: #8FA3BF;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        /* Empty State */
        .empty-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            gap: 8px;
            text-align: center;
            color: #8FA3BF;
        }

            .empty-view .icon {
                font-size: 40px;
            }

            .empty-view p {
                font-size: 14px;
            }

        /* Botão Flutuante (+) */
        .btn-fab {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 250px + 24px);
            width: 58px;
            height: 58px;
            background-color: #FF7A00;
            border-radius: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            border: none;
            z-index: 100;
            transition: transform 0.12s ease;
        }

        @media (max-width: 520px) {
            .btn-fab {
                right: 24px;
            }
        }

        .btn-fab:active {
            transform: scale(0.92);
        }

        .btn-fab span {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
            margin-top: -3px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Topo -->
        <header class="header-top">
            <div class="header-left">
                <button id="btnVoltar" class="action-btn hidden" onclick="voltarPagina()" title="Voltar">←</button>
                <div class="header-titles">
                    <h1>Apontamentos</h1>
                    <p>Banco de dados local</p>
                </div>
            </div>

            <div class="top-actions">
                <button id="btnSair" class="action-btn hidden" onclick="sairSessao()" title="Encerrar Sessão">🚪</button>
                <button id="btnSyncLote" class="action-btn" onclick="sincronizarLote()" title="Enviar pendentes para nuvem">☁️</button>
            </div>
        </header>

        <!-- 2. Barra de Busca -->
        <div class="search-box">
            <span style="color:#8FA3BF; font-size:13px;">🔍</span>
            <input type="text"
                   id="txtBusca"
                   placeholder="Buscar por O.S., Setor ou Executante..."
                   autocomplete="off"
                   spellcheck="false"
                   oninput="filtrarLista()" />
        </div>

        <!-- 3. Contador de Registros -->
        <div class="counter-bar">
            <span class="counter-label">APONTAMENTOS LOCAIS</span>
            <span class="counter-value" id="lblTotal">0 registro(s)</span>
        </div>

        <!-- 4. Lista dos Apontamentos com Swipe -->
        <div class="list-container" id="listaApontamentos">
            <!-- Renderizado dinamicamente -->
        </div>

        <!-- View Vazia -->
        <div id="emptyView" class="empty-view">
            <span class="icon">📋</span>
            <p>Nenhum apontamento local encontrado</p>
        </div>

        <!-- Botão Flutuante (+) -->
        <button class="btn-fab" onclick="novoApontamento()" title="Novo Apontamento">
            <span>+</span>
        </button>

    </div>

    <script>
        // =========================================================================
        // 1. CAPTURA ROBUSTA DO CLIENTE SUPABASE
        // =========================================================================
        function obterClienteSupabase() {
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase && typeof window.SUPABASE_URL !== 'undefined') {
                return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            }
            return null;
        }

        let _listaOriginal = [];
        let isSyncing = false;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof LocalDB !== 'undefined' && LocalDB.abrirConexao) {
                try { await LocalDB.abrirConexao(); } catch (_) { }
            }

            await validarUsuarioAtivo();
            configurarPermissoesVisuais();
            await carregarDadosAsync();

            if (navigator.onLine) {
                await atualizarEdicoesDoSupervisorAsync();
            }

            window.addEventListener('online', async () => {
                await atualizarEdicoesDoSupervisorAsync();
            });
        });

        // 1. Validação do Usuário Ativo
        async function validarUsuarioAtivo() {
            if (!navigator.onLine) return;

            const supabase = obterClienteSupabase();
            if (!supabase) return;

            const matricula = localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula");
            if (!matricula) return;

            try {
                const { data, error } = await supabase
                    .from('usuarios')
                    .select('matricula')
                    .eq('matricula', matricula);

                if (!error && (!data || data.length === 0)) {
                    alert("Acesso Revogado: Sessão encerrada: usuário não encontrado no servidor.");
                    desconectar();
                    window.location.replace("login.html");
                }
            } catch (err) {
                console.warn("Validação offline:", err);
            }
        }

        // 2. Permissões de Visibilidade
        function configurarPermissoesVisuais() {
            document.getElementById('btnVoltar').classList.remove('hidden');

            const nivel = (
                localStorage.getItem("NivelAcesso") ||
                localStorage.getItem("UsuarioNivel") ||
                localStorage.getItem("NivelUsuario") ||
                "Usuario"
            ).toLowerCase();

            const isUsuario = nivel === "usuario" || nivel === "3";
            document.getElementById('btnSair').classList.toggle('hidden', !isUsuario);
        }

        // 3. Consulta de Registros Locais (IndexedDB)
        async function carregarDadosAsync() {
            try {
                if (typeof LocalDB === 'undefined') {
                    console.error("LocalDB não está carregado. Verifique o db.js.");
                    return;
                }

                const matricula = (localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula") || "").trim();
                const nivel = (
                    localStorage.getItem("NivelAcesso") ||
                    localStorage.getItem("UsuarioNivel") ||
                    localStorage.getItem("NivelUsuario") ||
                    "Usuario"
                ).toLowerCase();
                const isUsuario = nivel === "usuario" || nivel === "3";

                let dados = await LocalDB.obterApontamentosLocais();

                dados.sort((a, b) => {
                    const diffData = new Date(b.data || 0) - new Date(a.data || 0);
                    if (diffData !== 0) return diffData;
                    return (b.id || 0) - (a.id || 0);
                });

                if (isUsuario && matricula) {
                    dados = dados.filter(a => {
                        const matExec = String(a.matricula_executante || '').trim();
                        const matUser = String(a.matricula_usuario || '').trim();
                        return matExec === matricula || matUser === matricula;
                    });
                }

                _listaOriginal = dados;
                filtrarLista();
            } catch (err) {
                console.error("Erro ao ler banco local:", err);
            }
        }

        // 4. Baixa edições feitas por supervisores/administradores no Supabase
        async function atualizarEdicoesDoSupervisorAsync() {
            if (!navigator.onLine) return;
            const supabase = obterClienteSupabase();
            if (!supabase) return;

            const matricula = (localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula") || "").trim();
            if (!matricula) return;

            try {
                const locais = await LocalDB.obterApontamentosLocais();
                if (locais.length === 0) return;

                const { data: remotos, error } = await supabase
                    .from('apontamentos')
                    .select('*')
                    .or(`matricula_executante.eq.${matricula},matricula_usuario.eq.${matricula}`);

                if (error || !remotos || remotos.length === 0) return;

                let houveModificacao = false;

                for (const remoto of remotos) {
                    const remotoId = Number(remoto.id);
                    const osRemota = extrairOrdemServico(remoto);
                    const dataRemota = String(remoto.data || '').substring(0, 10);
                    const hIniRemota = formatarHora(remoto.horainicio || remoto.hora_inicio);
                    const matExecRemota = String(remoto.matricula_executante || '').trim();

                    let local = locais.find(l => {
                        const idRem = l.remoto_id ?? l.id_remoto ?? l.remotoId;
                        if (idRem !== undefined && idRem !== null && Number(idRem) === remotoId) return true;

                        const osLoc = extrairOrdemServico(l);
                        if (osRemota !== '-' && osLoc !== '-' && osLoc.toLowerCase() === osRemota.toLowerCase()) return true;

                        const lData = String(l.data || '').substring(0, 10);
                        const lHora = formatarHora(l.horainicio || l.hora_inicio);
                        const lExec = String(l.matricula_executante || '').trim();

                        return (lData === dataRemota && lHora === hIniRemota && lExec === matExecRemota);
                    });

                    if (local && local.id) {
                        let alterou = false;

                        if (Number(local.remoto_id) !== remotoId) {
                            local.remoto_id = remotoId;
                            local.id_remoto = remotoId;
                            alterou = true;
                        }

                        if (osRemota !== '-' && (local.ordemservico !== osRemota || local.ordem_servico !== osRemota)) {
                            local.ordemservico = osRemota;
                            local.ordem_servico = osRemota;
                            alterou = true;
                        }

                        if (remoto.setor && local.setor !== remoto.setor) {
                            local.setor = remoto.setor;
                            alterou = true;
                        }

                        if (remoto.grupo && local.grupo !== remoto.grupo) {
                            local.grupo = remoto.grupo;
                            alterou = true;
                        }

                        if (hIniRemota && formatarHora(local.horainicio || local.hora_inicio) !== hIniRemota) {
                            local.horainicio = hIniRemota;
                            local.hora_inicio = hIniRemota;
                            alterou = true;
                        }

                        const hFimRemota = formatarHora(remoto.horafim || remoto.hora_fim);
                        if (hFimRemota && formatarHora(local.horafim || local.hora_fim) !== hFimRemota) {
                            local.horafim = hFimRemota;
                            local.hora_fim = hFimRemota;
                            alterou = true;
                        }

                        if (remoto.observacoes !== undefined && local.observacoes !== remoto.observacoes) {
                            local.observacoes = remoto.observacoes;
                            alterou = true;
                        }

                        if (!local.data_sincronizado) {
                            local.data_sincronizado = new Date().toISOString();
                            alterou = true;
                        }

                        if (alterou) {
                            await LocalDB.salvarApontamento(local);
                            houveModificacao = true;
                        }
                    }
                }

                if (houveModificacao) {
                    await carregarDadosAsync();
                }
            } catch (e) {
                console.warn("[Sync Nuvem -> Local]:", e);
            }
        }

        // Formatadores auxiliares
        function formatarData(valorData) {
            if (!valorData) return '';
            const dataIso = String(valorData).substring(0, 10);
            const partes = dataIso.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return valorData;
        }

        function formatarHora(h) {
            if (!h) return '';
            const s = String(h).trim();
            if (s.includes('T')) {
                const parteTempo = s.split('T')[1];
                if (parteTempo && parteTempo.includes(':')) {
                    const sub = parteTempo.split(':');
                    return `${sub[0].padStart(2, '0')}:${sub[1].padStart(2, '0')}`;
                }
            }
            if (s.includes(':')) {
                const partes = s.split(':');
                return `${partes[0].padStart(2, '0')}:${(partes[1] || '00').substring(0, 2).padStart(2, '0')}`;
            }
            const digitos = s.replace(/\D/g, '');
            if (digitos.length >= 4) {
                return `${digitos.slice(0, 2)}:${digitos.slice(2, 4)}`;
            }
            return s;
        }

        function extrairOrdemServico(item) {
            if (!item) return '-';
            const candidatos = [
                item.ordemservico,
                item.ordem_servico,
                item.OrdemServico,
                item.numero_os,
                item.num_os,
                item.os,
                item.OS
            ];
            for (const val of candidatos) {
                if (val !== undefined && val !== null && String(val).trim() !== '') {
                    return String(val).trim();
                }
            }
            return '-';
        }

        // 5. Renderização da Lista
        function filtrarLista() {
            const termo = document.getElementById('txtBusca')?.value?.trim().toLowerCase() || "";
            const container = document.getElementById('listaApontamentos');
            const emptyView = document.getElementById('emptyView');
            const lblTotal = document.getElementById('lblTotal');

            const filtrados = !termo
                ? _listaOriginal
                : _listaOriginal.filter(a =>
                    extrairOrdemServico(a).toLowerCase().includes(termo) ||
                    String(a.setor || "").toLowerCase().includes(termo) ||
                    String(a.grupo || "").toLowerCase().includes(termo) ||
                    String(a.matricula_executante || "").toLowerCase().includes(termo) ||
                    String(a.observacoes || "").toLowerCase().includes(termo)
                );

            const pendentes = _listaOriginal.filter(a => !a.data_sincronizado).length;
            lblTotal.textContent = `${filtrados.length} registro(s)  /${pendentes} pendente(s)`;

            if (filtrados.length === 0) {
                container.innerHTML = "";
                emptyView.style.display = "flex";
                return;
            }

            emptyView.style.display = "none";

            container.innerHTML = filtrados.map(item => {
                const id = item.id;
                const os = extrairOrdemServico(item);
                const setor = item.setor || '-';
                const grupo = item.grupo || 'Mantenedor';
                const dataStr = formatarData(item.data);
                const matricula = item.matricula_executante || '-';
                const inicio = formatarHora(item.horainicio || item.hora_inicio);
                const fim = formatarHora(item.horafim || item.hora_fim);
                const obs = item.observacoes || '';

                const isSincronizado = !!item.data_sincronizado;
                const statusTexto = isSincronizado ? "✅ Enviado" : "⏳ Pendente";
                const statusClass = isSincronizado ? "enviado" : "pendente";

                const botaoSync = !isSincronizado
                    ? `<button class="swipe-btn btn-sync" onclick="onEnviarItemClicked(${id})">Enviar ☁️</button>`
                    : ``;

                return `
                        <div class="swipe-container" id="card-${id}">
                            <div class="swipe-actions" data-buttons="${isSincronizado ? 2 : 3}">
                                ${botaoSync}
                                <button class="swipe-btn btn-edit" onclick="editarItem(${id})">Editar</button>
                                <button class="swipe-btn btn-delete" onclick="excluirItem(${id})">Excluir</button>
                            </div>
                            <div class="item-card" data-open="false">
                                <!-- Linha 1: O.S com Status abaixo à esquerda; Data com Setor abaixo à direita -->
                                <div class="card-line-1">
                                    <div class="os-status-group">
                                        <span class="badge-os">${os}</span>
                                        <span class="badge-status ${statusClass}">${statusTexto}</span>
                                    </div>
                                    <div class="meta-right-group">
                                        <span class="data-text">${dataStr}</span>
                                        <span class="badge-setor">Setor: ${setor}</span>
                                    </div>
                                </div>

                                <!-- Divisor Interno Suave -->
                                <div class="card-divider"></div>

                                <!-- Linha 2: Matrícula e Horários + Grupo -->
                                <div class="card-line-2">
                                    <div class="matricula-group">
                                        <span class="matricula-label">Matrícula:</span>
                                        <span class="matricula-value">${matricula}</span>
                                    </div>

                                    <div class="horarios-wrapper">
                                        <div class="horarios-group">
                                            <span style="font-size:12px; color:#8FA3BF;">⏱</span>
                                            <span class="horario-text">${inicio || '--:--'}</span>
                                            <span class="ate-text">até</span>
                                            <span class="horario-text">${fim || '--:--'}</span>
                                        </div>
                                        <span class="badge-grupo">Grupo: ${grupo}</span>
                                    </div>
                                </div>

                                <!-- Linha 3: Observações -->
                                ${obs ? `<div class="card-obs">${obs}</div>` : ''}
                            </div>
                        </div>
                    `;
            }).join('');

            configurarGestosSwipe();
        }

        // =========================================================================
        // 6. GESTOS DE SWIPE UNIFICADOS
        // =========================================================================
        function configurarGestosSwipe() {
            const cards = document.querySelectorAll('.item-card');
            const GATILHO_ABERTURA = 45;

            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let initialOffset = 0;
            let larguraPainel = 140;
            let movendoHorizontal = false;
            let cardAberto = null;
            let activePointerId = null;

            cards.forEach(card => {
                const container = card.closest('.swipe-container');
                const actions = container.querySelector('.swipe-actions');
                const numBotoes = parseInt(actions.getAttribute('data-buttons') || '2', 10);
                const larguraLimite = numBotoes === 3 ? 210 : 140;

                card.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;

                    isDragging = true;
                    activePointerId = e.pointerId;
                    startX = e.clientX;
                    startY = e.clientY;
                    currentX = startX;
                    movendoHorizontal = false;
                    larguraPainel = larguraLimite;

                    const isAberto = card.getAttribute('data-open') === 'true';
                    initialOffset = isAberto ? -larguraPainel : 0;

                    if (cardAberto && cardAberto !== card) {
                        cardAberto.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                        cardAberto.style.transform = 'translateX(0px)';
                        cardAberto.setAttribute('data-open', 'false');
                        cardAberto = null;
                    }

                    card.style.transition = 'none';

                    try {
                        card.setPointerCapture(e.pointerId);
                    } catch (_) { }
                });

                card.addEventListener('pointermove', (e) => {
                    if (!isDragging || e.pointerId !== activePointerId) return;

                    currentX = e.clientX;
                    const diffX = currentX - startX;
                    const diffY = e.clientY - startY;

                    if (!movendoHorizontal && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 6) {
                        movendoHorizontal = true;
                    }

                    if (movendoHorizontal) {
                        let novaPosicao = initialOffset + diffX;
                        if (novaPosicao > 0) novaPosicao = 0;
                        if (novaPosicao < -larguraPainel) {
                            novaPosicao = -larguraPainel + (novaPosicao + larguraPainel) * 0.2;
                        }
                        card.style.transform = `translateX(${novaPosicao}px)`;
                    }
                });

                const finalizarArraste = (e) => {
                    if (!isDragging || (activePointerId !== null && e.pointerId !== activePointerId)) return;

                    isDragging = false;
                    try {
                        card.releasePointerCapture(e.pointerId);
                    } catch (_) { }

                    card.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    const diffX = currentX - startX;
                    const isAberto = card.getAttribute('data-open') === 'true';

                    if (!movendoHorizontal) {
                        if (isAberto) {
                            card.style.transform = 'translateX(0px)';
                            card.setAttribute('data-open', 'false');
                            if (cardAberto === card) cardAberto = null;
                        }
                        return;
                    }

                    if (!isAberto) {
                        if (diffX < -GATILHO_ABERTURA) {
                            card.style.transform = `translateX(-${larguraPainel}px)`;
                            card.setAttribute('data-open', 'true');
                            cardAberto = card;
                        } else {
                            card.style.transform = 'translateX(0px)';
                            card.setAttribute('data-open', 'false');
                        }
                    } else {
                        if (diffX > GATILHO_ABERTURA) {
                            card.style.transform = 'translateX(0px)';
                            card.setAttribute('data-open', 'false');
                            if (cardAberto === card) cardAberto = null;
                        } else {
                            card.style.transform = `translateX(-${larguraPainel}px)`;
                            card.setAttribute('data-open', 'true');
                        }
                    }

                    activePointerId = null;
                };

                card.addEventListener('pointerup', finalizarArraste);
                card.addEventListener('pointercancel', finalizarArraste);
            });

            document.addEventListener('pointerdown', (e) => {
                if (cardAberto && !e.target.closest('.swipe-container')) {
                    cardAberto.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    cardAberto.style.transform = 'translateX(0px)';
                    cardAberto.setAttribute('data-open', 'false');
                    cardAberto = null;
                }
            });
        }

        // =========================================================================
        // 7. SINCRONIZAÇÃO INDIVIDUAL E EM LOTE
        // =========================================================================
        async function onEnviarItemClicked(id) {
            if (isSyncing) return;
            isSyncing = true;

            const supabase = obterClienteSupabase();

            try {
                const todos = await LocalDB.obterApontamentosLocais();
                const item = todos.find(x => x.id === id);

                if (!item || item.data_sincronizado) {
                    alert(`A O.S. ${extrairOrdemServico(item)} já foi transmitida.`);
                    await carregarDadosAsync();
                    return;
                }

                if (!confirm(`Deseja transmitir a O.S. ${extrairOrdemServico(item)} para a nuvem?`)) return;

                if (!navigator.onLine || !supabase) {
                    alert("Sem conexão: O dispositivo está sem internet no momento.");
                    return;
                }

                const matriculaLogada = localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula") || "---";

                const itemRemoto = {
                    matricula_usuario: item.matricula_usuario || matriculaLogada,
                    data: item.data,
                    ordemservico: extrairOrdemServico(item),
                    matricula_executante: item.matricula_executante || '',
                    horainicio: formatarHora(item.horainicio || item.hora_inicio),
                    horafim: formatarHora(item.horafim || item.hora_fim),
                    setor: item.setor || '',
                    observacoes: item.observacoes || '',
                    grupo: item.grupo || 'Mantenedor'
                };

                const { data: retNuvem, error } = await supabase
                    .from('apontamentos')
                    .insert([itemRemoto])
                    .select();

                if (error) throw error;

                item.data_sincronizado = new Date().toISOString();
                if (retNuvem && retNuvem.length > 0) {
                    item.remoto_id = retNuvem[0].id;
                    item.id_remoto = retNuvem[0].id;
                }

                await LocalDB.salvarApontamento(item);

                alert("Sucesso: Apontamento sincronizado com sucesso!");
                await carregarDadosAsync();

            } catch (ex) {
                console.error(ex);
                alert(`Erro ao sincronizar: ${ex.message || ex}`);
            } finally {
                isSyncing = false;
            }
        }

        async function sincronizarLote() {
            if (isSyncing) return;
            isSyncing = true;

            const supabase = obterClienteSupabase();

            try {
                const todos = await LocalDB.obterApontamentosLocais();
                const pendentes = todos.filter(a => !a.data_sincronizado);

                if (pendentes.length === 0) {
                    alert("Não há apontamentos pendentes para transmissão.");
                    return;
                }

                if (!navigator.onLine || !supabase) {
                    alert("Sem conexão à internet no momento.");
                    return;
                }

                if (!confirm(`Transmitir ${pendentes.length} apontamento(s) pendente(s) agora?`)) return;

                const matriculaLogada = localStorage.getItem("MatriculaUsuario") || localStorage.getItem("UsuarioMatricula") || "---";

                const loteRemoto = pendentes.map(p => ({
                    matricula_usuario: p.matricula_usuario || matriculaLogada,
                    data: p.data,
                    ordemservico: extrairOrdemServico(p),
                    matricula_executante: p.matricula_executante || '',
                    horainicio: formatarHora(p.horainicio || p.hora_inicio),
                    horafim: formatarHora(p.horafim || p.hora_fim),
                    setor: p.setor || '',
                    observacoes: p.observacoes || '',
                    grupo: p.grupo || 'Mantenedor'
                }));

                const { data: retNuvem, error } = await supabase
                    .from('apontamentos')
                    .insert(loteRemoto)
                    .select();

                if (error) throw error;

                const agora = new Date().toISOString();
                for (let i = 0; i < pendentes.length; i++) {
                    const item = pendentes[i];
                    item.data_sincronizado = agora;
                    if (retNuvem && retNuvem.length > i) {
                        item.remoto_id = retNuvem[i].id;
                        item.id_remoto = retNuvem[i].id;
                    }
                    await LocalDB.salvarApontamento(item);
                }

                alert(`Sucesso: ${pendentes.length} apontamento(s) sincronizado(s)!`);
                await carregarDadosAsync();

            } catch (ex) {
                console.error(ex);
                alert(`Falha ao sincronizar lote: ${ex.message || ex}`);
            } finally {
                isSyncing = false;
            }
        }

        // =========================================================================
        // 8. AÇÕES E NAVEGAÇÃO
        // =========================================================================
        function novoApontamento() {
            window.location.href = "novoapontamento.html";
        }

        async function editarItem(id) {
            const todos = await LocalDB.obterApontamentosLocais();
            const item = todos.find(x => x.id === id);

            if (item && item.data_sincronizado) {
                const remotoId = item.remoto_id || item.id_remoto;
                if (remotoId) {
                    window.location.href = `novoapontamento.html?remotoId=${remotoId}`;
                    return;
                }
            }

            window.location.href = `novoapontamento.html?id=${id}`;
        }

        async function excluirItem(id) {
            const todos = await LocalDB.obterApontamentosLocais();
            const item = todos.find(x => x.id === id);
            const os = item ? extrairOrdemServico(item) : "Sem O.S.";

            if (!confirm(`Excluir Localmente: Deseja excluir a O.S. ${os}?`)) return;

            try {
                await LocalDB.excluirApontamento(id);
                await carregarDadosAsync();
            } catch (err) {
                alert(`Erro ao excluir: ${err.message || err}`);
            }
        }

        function voltarPagina() {
            window.location.href = "index.html";
        }

        function desconectar() {
            localStorage.removeItem("auth_token");
            localStorage.removeItem("UsuarioMatricula");
            localStorage.removeItem("MatriculaUsuario");
            localStorage.removeItem("UsuarioNome");
            localStorage.removeItem("UsuarioGrupo");
            localStorage.removeItem("UsuarioNivel");
            localStorage.removeItem("NivelUsuario");
            localStorage.removeItem("NivelAcesso");
        }

        function sairSessao() {
            if (confirm("Deseja encerrar a sessão?")) {
                desconectar();
                window.location.replace("login.html");
            }
        }
    </script>
