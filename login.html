<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Login - Apontamento</title>

    <!-- Configurações PWA para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apontamento" />
    <link rel="apple-touch-icon" href="icoapontamento.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Supabase JS Client Oficial -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #081426 0%, #020912 50%, #0A1D38 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-left: 28px;
            padding-right: 28px;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: auto 0;
        }

        /* Topo: Logo e Títulos */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .logo-box {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .logo-box img {
                width: 72px;
                height: 72px;
                object-fit: contain;
            }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .header p {
            font-size: 13px;
            color: #8FA3BF;
        }

        /* Card de Login */
        .login-card {
            background-color: #0B1C33;
            border: 1px solid #173154;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .input-group label {
                font-size: 13px;
                font-weight: 700;
                color: #8FA3BF;
            }

        .input-box {
            background-color: #061221;
            border: 1px solid #1B3352;
            border-radius: 12px;
            height: 50px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            transition: border-color 0.2s ease;
        }

            .input-box:focus-within {
                border-color: #2F80ED;
            }

            .input-box input {
                width: 100%;
                height: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 15px;
                user-select: text;
            }

                .input-box input::placeholder {
                    color: #4B6382;
                }

        .btn-toggle-senha {
            background: transparent;
            border: none;
            color: #8FA3BF;
            font-size: 18px;
            cursor: pointer;
            margin-left: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .loading-container {
            display: none;
            justify-content: center;
            align-items: center;
            height: 24px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(47, 128, 237, 0.2);
            border-top-color: #2F80ED;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-entrar {
            height: 52px;
            background-color: #2F80ED;
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

            .btn-entrar:active {
                transform: scale(0.98);
                opacity: 0.9;
            }

            .btn-entrar:disabled {
                background-color: #1a4985;
                cursor: not-allowed;
                opacity: 0.7;
            }
    </style>
</head>
<body>

    <div class="main-container">

        <header class="header">
            <div class="logo-box">
                <img src="icoapontamento.png" alt="Logo" onerror="this.outerHTML='<span style=\'font-size:46px;\'>📋</span>'" />
            </div>
            <h1>Apontamento</h1>
            <p>Informe suas credenciais para acessar</p>
        </header>

        <main class="login-card">
            <form id="loginForm" onsubmit="onEntrarClicked(event)">

                <!-- Matrícula -->
                <div class="input-group">
                    <label for="txtMatricula">Matrícula</label>
                    <div class="input-box">
                        <input type="tel"
                               id="txtMatricula"
                               inputmode="numeric"
                               pattern="[0-9]*"
                               placeholder="Digite sua matrícula"
                               autocomplete="username"
                               required />
                    </div>
                </div>

                <!-- Senha -->
                <div class="input-group">
                    <label for="txtSenha">Senha</label>
                    <div class="input-box">
                        <input type="password"
                               id="txtSenha"
                               placeholder="Digite sua senha"
                               autocomplete="current-password"
                               required />
                        <button type="button" id="lblOlhoSenha" class="btn-toggle-senha" onclick="onAlternarSenhaTapped()">
                            👁
                        </button>
                    </div>
                </div>

                <!-- Indicador de Carregamento -->
                <div id="loadingIndicator" class="loading-container">
                    <div class="spinner"></div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" id="btnEntrar" class="btn-entrar">
                    Entrar no Sistema
                </button>

            </form>
        </main>

    </div>

    <script>
        // Credenciais extraídas do seu AuthService.cs
        const SUPABASE_URL = "https://mtlbrhmpiwvzjwbzaywi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qilTaEWSiDNr1L-N5uE5gA_NYyLkyBt";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let _senhaOculta = true;

        // Auto-login: se já estiver autenticado (equivalente ao EstaAutenticadoAsync)
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem("auth_token");
            const nivel = localStorage.getItem("UsuarioNivel") || localStorage.getItem("NivelUsuario");

            if (token && nivel) {
                redirecionarPorNivel(nivel);
            }
        });

        // Alterna cor e visibilidade do campo de senha
        function onAlternarSenhaTapped() {
            _senhaOculta = !_senhaOculta;
            const txtSenha = document.getElementById('txtSenha');
            const lblOlhoSenha = document.getElementById('lblOlhoSenha');

            txtSenha.type = _senhaOculta ? 'password' : 'text';
            lblOlhoSenha.style.color = _senhaOculta ? '#8FA3BF' : '#2F80ED';
        }

        // Equivalente a OnEntrarClicked + AuthService.AutenticarAsync
        async function onEntrarClicked(e) {
            e.preventDefault();

            const txtMatricula = document.getElementById('txtMatricula');
            const txtSenha = document.getElementById('txtSenha');
            const btnEntrar = document.getElementById('btnEntrar');
            const loadingIndicator = document.getElementById('loadingIndicator');

            const matricula = txtMatricula.value?.trim() || '';
            const senha = txtSenha.value?.trim() || '';

            if (!matricula || !senha) {
                alert("Preencha matrícula e senha.");
                return;
            }

            try {
                btnEntrar.disabled = true;
                loadingIndicator.style.display = 'flex';

                // =========================================================================
                // 1. CONSULTA DIRETA NA TABELA 'usuarios' (IGUAL AO SEU MAUI)
                // =========================================================================
                const { data: listaUsuarios, error: erroConsulta } = await supabaseClient
                    .from('usuarios')
                    .select('*')
                    .eq('matricula', matricula)
                    .eq('senha', senha);

                if (erroConsulta) {
                    throw new Error(`Erro ao conectar ao servidor: ${erroConsulta.message}`);
                }

                const usuario = (listaUsuarios && listaUsuarios.length > 0) ? listaUsuarios[0] : null;

                // Falha de autenticação
                if (!usuario) {
                    alert("Matrícula ou senha incorretos.");
                    return;
                }

                // =========================================================================
                // 2. EXTRAÇÃO DOS DADOS (IGUAL AO SEU AuthService.cs)
                // =========================================================================
                const nomeFinal = (usuario.nome && usuario.nome.trim().length > 0)
                    ? usuario.nome.trim()
                    : usuario.matricula;

                const grupoFinal = (usuario.grupo && usuario.grupo.trim().length > 0)
                    ? usuario.grupo.trim()
                    : "Mantenedor";

                const nivelFinal = usuario.nivel ? usuario.nivel : "Usuario";

                // Salva no localStorage (equivalente a SecureStorage e Preferences.Default)
                localStorage.setItem("auth_token", String(usuario.id));
                localStorage.setItem("UsuarioMatricula", String(usuario.matricula));
                localStorage.setItem("MatriculaUsuario", String(usuario.matricula)); // Retrocompatibilidade
                localStorage.setItem("UsuarioNome", nomeFinal);
                localStorage.setItem("UsuarioGrupo", grupoFinal);
                localStorage.setItem("UsuarioNivel", nivelFinal);
                localStorage.setItem("NivelUsuario", nivelFinal); // Retrocompatibilidade

                // =========================================================================
                // 3. REGISTRO FCM TOKEN
                // =========================================================================
                await registrarDispositivoFcmAsync(usuario.matricula);

                // =========================================================================
                // 4. NAVEGAÇÃO BASEADA NO NÍVEL (Shell Routing)
                // =========================================================================
                redirecionarPorNivel(nivelFinal);

            } catch (ex) {
                console.error(ex);
                alert(`Não foi possível conectar ao servidor: ${ex.message || ex}`);
            } finally {
                loadingIndicator.style.display = 'none';
                btnEntrar.disabled = false;
            }
        }

        function redirecionarPorNivel(nivel) {
            const nivelLimpo = String(nivel).trim().toLowerCase();
            const isApenasUsuario = nivelLimpo === "usuario" || nivelLimpo === "3";

            if (isApenasUsuario) {
                window.location.replace("listaapontamento.html");
            } else {
                window.location.replace("index.html");
            }
        }

        async function registrarDispositivoFcmAsync(matricula) {
            try {
                let fcmToken = localStorage.getItem("FCM_Token") || "";
                let tentativas = 0;

                while (!fcmToken && tentativas < 5) {
                    await new Promise(r => setTimeout(r, 500));
                    fcmToken = localStorage.getItem("FCM_Token") || "";
                    tentativas++;
                }

                if (fcmToken) {
                    await supabaseClient
                        .from('usuario_dispositivo')
                        .upsert({
                            matricula: String(matricula).trim(),
                            fcm_token: fcmToken,
                            atualizado_em: new Date().toISOString()
                        }, { onConflict: 'matricula' });
                }
            } catch (err) {
                console.warn("[FCM_LOGIN] Aviso ao sincronizar token:", err);
            }
        }
    </script>
</body>
</html>
