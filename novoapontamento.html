<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Novo Apontamento</title>

    <!-- Configurações PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apontamento" />
    <link rel="apple-touch-icon" href="icoapontamento.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Supabase JS Client Oficial e Banco Local IndexedDB -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #081426 0%, #020912 50%, #0A1D38 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* 1. Topo: Botão Voltar e Título (Padding: 24px, 35px, 24px, 14px) */
        .header-top {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            padding: calc(35px + env(safe-area-inset-top)) 24px 14px 24px;
        }

        .btn-voltar {
            background-color: #0E223D;
            border: 1px solid #1F3A60;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #FFFFFF;
            font-size: 20px;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.12s ease;
        }

            .btn-voltar:active {
                transform: scale(0.95);
                background-color: #173763;
            }

        .header-titles {
            margin-left: 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

            .header-titles h1 {
                font-size: 22px;
                font-weight: 700;
                color: #FFFFFF;
                line-height: 1.2;
            }

            .header-titles span {
                font-size: 12px;
                font-weight: 700;
                color: #FF9838;
            }

        /* 2. Formulário com Scroll (Padding: 24px, 10px, 24px, 30px) */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 24px calc(30px + env(safe-area-inset-bottom)) 24px;
        }

        .form-card {
            background-color: #0B1C33;
            border: 1px solid #173154;
            border-radius: 20px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .input-group label {
                font-size: 12px;
                font-weight: 700;
                color: #8FA3BF;
            }

        .input-box {
            background-color: #061221;
            border: 1px solid #1B3352;
            border-radius: 12px;
            height: 50px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            position: relative;
            transition: border-color 0.2s ease;
        }

            .input-box:focus-within {
                border-color: #00C48C;
            }

            .input-box input,
            .input-box select {
                width: 100%;
                height: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 14px;
            }

                .input-box input::placeholder {
                    color: #4B6382;
                }

                .input-box input[type="date"] {
                    color-scheme: dark;
                }

            .input-box select {
                cursor: pointer;
                appearance: none;
            }

                .input-box select option {
                    background-color: #061221;
                    color: #FFFFFF;
                }

        /* Grid de Horários lado a lado */
        .grid-horarios {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 12px;
        }

        .time-box-wrapper {
            padding: 0 0 0 12px;
            display: grid;
            grid-template-columns: 1fr 40px;
            align-items: center;
        }

        .btn-relogio-container {
            width: 40px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .icon-relogio {
            font-size: 18px;
            color: #8FA3BF;
            pointer-events: none;
        }

        .picker-tempo-nativo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.01;
            cursor: pointer;
        }

        /* Observações com altura de 90px */
        .input-box-textarea {
            background-color: #061221;
            border: 1px solid #1B3352;
            border-radius: 12px;
            height: 90px;
            padding: 10px 14px;
            display: flex;
            transition: border-color 0.2s ease;
        }

            .input-box-textarea:focus-within {
                border-color: #00C48C;
            }

            .input-box-textarea textarea {
                width: 100%;
                height: 100%;
                background: transparent;
                border: none;
                outline: none;
                color: #FFFFFF;
                font-size: 14px;
                resize: none;
            }

                .input-box-textarea textarea::placeholder {
                    color: #4B6382;
                }

        /* Botão Salvar (Cor #FF7A00, Raio 14, Altura 52) */
        .btn-salvar {
            background-color: #FF7A00;
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            height: 52px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }

            .btn-salvar:active {
                transform: scale(0.98);
                opacity: 0.9;
            }

            .btn-salvar:disabled {
                background-color: #7A3F0B;
                cursor: not-allowed;
                opacity: 0.6;
            }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- 1. Topo: Botão Voltar e Título -->
        <header class="header-top">
            <button type="button" class="btn-voltar" onclick="onVoltarTapped()" title="Voltar">←</button>
            <div class="header-titles">
                <h1 id="lblTitulo">Novo Apontamento</h1>
                <span id="lblMatriculaOperador">Operador: ---</span>
            </div>
        </header>

        <!-- 2. Formulário com Rolagem -->
        <main class="content-scroll">
            <form id="formApontamento" class="form-card" onsubmit="onSalvarApontamentoClicked(event)">

                <!-- Data -->
                <div class="input-group">
                    <label for="dpData">Data</label>
                    <div class="input-box">
                        <input type="date" id="dpData" required />
                    </div>
                </div>

                <!-- Ordem de Serviço (Único campo Opcional) -->
                <div class="input-group">
                    <label for="txtOrdemServico">Ordem de Serviço (Opcional)</label>
                    <div class="input-box">
                        <input type="text"
                               id="txtOrdemServico"
                               placeholder="Ex: OS-2026-001"
                               autocomplete="off"
                               spellcheck="false" />
                    </div>
                </div>

                <!-- Matrícula Executante -->
                <div class="input-group">
                    <label for="txtMatriculaExecutante">Matrícula</label>
                    <div class="input-box">
                        <input type="text"
                               id="txtMatriculaExecutante"
                               placeholder="Ex: 1024"
                               inputmode="numeric"
                               autocomplete="off"
                               spellcheck="false"
                               required />
                    </div>
                </div>

                <!-- Horas: Inicial e Final -->
                <div class="grid-horarios">

                    <!-- Hora Inicial -->
                    <div class="input-group">
                        <label for="txtHoraInicio">Hora Inicial</label>
                        <div class="input-box time-box-wrapper">
                            <input type="text"
                                   id="txtHoraInicio"
                                   placeholder="07:10"
                                   maxlength="5"
                                   inputmode="numeric"
                                   oninput="onHoraInput(this)"
                                   required />
                            <div class="btn-relogio-container">
                                <span class="icon-relogio">🕒</span>
                                <input type="time"
                                       id="tpNativoInicio"
                                       class="picker-tempo-nativo"
                                       onchange="onTimePickerNativo(this, 'txtHoraInicio')" />
                            </div>
                        </div>
                    </div>

                    <!-- Hora Final -->
                    <div class="input-group">
                        <label for="txtHoraFim">Hora Final</label>
                        <div class="input-box time-box-wrapper">
                            <input type="text"
                                   id="txtHoraFim"
                                   placeholder="16:40"
                                   maxlength="5"
                                   inputmode="numeric"
                                   oninput="onHoraInput(this)"
                                   required />
                            <div class="btn-relogio-container">
                                <span class="icon-relogio">🕒</span>
                                <input type="time"
                                       id="tpNativoFim"
                                       class="picker-tempo-nativo"
                                       onchange="onTimePickerNativo(this, 'txtHoraFim')" />
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Setor com Picker -->
                <div class="input-group">
                    <label for="pickerSetor">Setor</label>
                    <div class="input-box">
                        <select id="pickerSetor" required>
                            <option value="" disabled selected hidden>Selecione o setor...</option>
                        </select>
                    </div>
                </div>

                <!-- Observações (Obrigatório conforme C#) -->
                <div class="input-group">
                    <label for="txtObservacoes">Observações</label>
                    <div class="input-box-textarea">
                        <textarea id="txtObservacoes"
                                  placeholder="Descrição da tarefa..."
                                  spellcheck="false"
                                  required></textarea>
                    </div>
                </div>

                <!-- Botão Gravar -->
                <button type="submit" id="btnSalvar" class="btn-salvar">
                    Gravar Apontamento
                </button>

            </form>
        </main>

    </div>

    <script>
        // =========================================================================
        // 1. CONFIGURAÇÕES SUPABASE
        // =========================================================================
        const SUPABASE_URL = "https://mtlbrhmpiwvzjwbzaywi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qilTaEWSiDNr1L-N5uE5gA_NYyLkyBt";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let _apontamentoEdicao = null;
        let _apontamentoRemotoEdicao = null;
        let _setorPendenteSelecao = null;
        const Setores = [];

        document.addEventListener('DOMContentLoaded', async () => {
            configurarValoresPadrao();
            await carregarSetoresAsync();
            await verificarParametrosRota();
        });

        // ConfigurarValoresPadrao
        function configurarValoresPadrao() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dpData').value = hoje;

            document.getElementById('txtHoraInicio').value = "07:10";
            document.getElementById('txtHoraFim').value = "16:40";
            document.getElementById('tpNativoInicio').value = "07:10";
            document.getElementById('tpNativoFim').value = "16:40";

            const matriculaUsuario = localStorage.getItem("MatriculaUsuario") || "---";
            document.getElementById('lblMatriculaOperador').textContent = `Operador: ${matriculaUsuario}`;

            if (matriculaUsuario !== "---") {
                document.getElementById('txtMatriculaExecutante').value = matriculaUsuario;
            }
        }

        // CarregarSetoresAsync corrigido e resiliente
        async function carregarSetoresAsync() {
            const select = document.getElementById('pickerSetor');

            // Função auxiliar interna para pintar o <select>
            function renderizarOpcoes(listaNomes) {
                Setores.length = 0;
                select.innerHTML = '<option value="" disabled selected hidden>Selecione o setor...</option>';

                // Ordena em ordem alfabética
                const ordenados = [...listaNomes].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

                ordenados.forEach(nome => {
                    Setores.push(nome);
                    const opt = document.createElement('option');
                    opt.value = nome;
                    opt.textContent = nome;
                    select.appendChild(opt);
                });

                if (_setorPendenteSelecao) {
                    definirSetorSelecionado(_setorPendenteSelecao);
                }
            }

            // PASSO 1: Lê o que já existe no banco local (IndexedDB) para exibição imediata
            try {
                const setoresLocais = await LocalDB.obterSetores();
                if (setoresLocais && setoresLocais.length > 0) {
                    renderizarOpcoes(setoresLocais.map(s => s.nome));
                }
            } catch (eLocal) {
                console.warn("Aviso ao ler banco local inicialmente:", eLocal);
            }

            // PASSO 2: Busca no Supabase se houver conexão
            if (!navigator.onLine) return;

            try {
                console.log("Buscando setores no Supabase...");
                const { data: respostaNuvem, error } = await supabaseClient
                    .from('setores')
                    .select('id, nome');

                if (error) {
                    console.error("Erro retornado pelo Supabase na tabela setores:", error.message);
                    return;
                }

                if (respostaNuvem && respostaNuvem.length > 0) {
                    console.log("Setores retornados do Supabase:", respostaNuvem);

                    // Coleta os nomes válidos da nuvem
                    const nomesNuvem = respostaNuvem
                        .map(s => (s.nome || '').trim())
                        .filter(n => n.length > 0);

                    // Salva cada setor no banco local sem travar a execução
                    for (const s of respostaNuvem) {
                        if (s.nome && s.nome.trim()) {
                            try {
                                await LocalDB.salvarSetor(s.nome.trim(), s.id);
                            } catch (errSave) {
                                // Ignora erro de duplicidade se já existir
                            }
                        }
                    }

                    // Atualiza a tela com a lista consolidada
                    renderizarOpcoes([...new Set(nomesNuvem)]);

                    if (_setorPendenteSelecao) {
                        _setorPendenteSelecao = null;
                    }
                } else {
                    console.warn("Supabase retornou lista vazia. Verifique permissões RLS ou registros na tabela 'setores'.");
                }
            } catch (ex) {
                console.error("Falha geral ao conectar com o Supabase:", ex);
            }
        }

        // DefinirSetorSelecionado
        function definirSetorSelecionado(nomeSetor) {
            if (!nomeSetor || !nomeSetor.trim()) {
                document.getElementById('pickerSetor').value = "";
                return;
            }

            const setorTrim = nomeSetor.trim();

            if (Setores.length === 0) {
                _setorPendenteSelecao = setorTrim;
                return;
            }

            const select = document.getElementById('pickerSetor');
            const encontrado = Setores.find(s => s.toLowerCase() === setorTrim.toLowerCase());

            if (encontrado) {
                select.value = encontrado;
            } else {
                const opt = document.createElement('option');
                opt.value = setorTrim;
                opt.textContent = setorTrim;
                select.appendChild(opt);
                select.value = setorTrim;
                Setores.push(setorTrim);
            }
        }

        // IQueryAttributable: ApplyQueryAttributes
        async function verificarParametrosRota() {
            const params = new URLSearchParams(window.location.search);
            const localId = params.get('id');
            const remotoId = params.get('remotoId');

            if (remotoId) {
                try {
                    const { data, error } = await supabaseClient
                        .from('apontamentos')
                        .select('*')
                        .eq('id', remotoId)
                        .single();

                    if (!error && data) {
                        _apontamentoRemotoEdicao = data;
                        carregarDadosRemotosParaEdicao(data);
                    }
                } catch (err) {
                    console.error(`Erro ao carregar dados remotos: ${err.message || err}`);
                }
                return;
            }

            if (localId) {
                const item = await LocalDB.obterApontamentoPorId(localId);
                if (item) {
                    _apontamentoEdicao = item;
                    carregarDadosParaEdicao(item);
                }
            }
        }

        // CarregarDadosParaEdicao (Local)
        function carregarDadosParaEdicao(item) {
            document.title = "Editar Apontamento";
            document.getElementById('lblTitulo').textContent = "Editar Apontamento Local";
            document.getElementById('btnSalvar').textContent = "Atualizar Apontamento";

            document.getElementById('dpData').value = item.data;
            document.getElementById('txtOrdemServico').value = item.ordem_servico || '';
            definirSetorSelecionado(item.setor);
            document.getElementById('txtMatriculaExecutante').value = item.matricula_executante || '';
            document.getElementById('txtObservacoes').value = item.observacoes || '';

            document.getElementById('txtHoraInicio').value = item.hora_inicio || '';
            document.getElementById('txtHoraFim').value = item.hora_fim || '';
            document.getElementById('tpNativoInicio').value = item.hora_inicio || '';
            document.getElementById('tpNativoFim').value = item.hora_fim || '';

            document.getElementById('lblMatriculaOperador').textContent = `Editando Local ID: #${item.id}`;
        }

        // CarregarDadosRemotosParaEdicao (Nuvem)
        function carregarDadosRemotosParaEdicao(item) {
            document.title = "Editar na Nuvem";
            document.getElementById('lblTitulo').textContent = "Editar Apontamento (Nuvem)";
            document.getElementById('btnSalvar').textContent = "Salvar Dados";

            if (item.data) {
                document.getElementById('dpData').value = item.data.split('T')[0];
            }

            document.getElementById('txtOrdemServico').value = item.ordem_servico || '';
            definirSetorSelecionado(item.setor);
            document.getElementById('txtMatriculaExecutante').value = item.matricula_executante || '';
            document.getElementById('txtObservacoes').value = item.observacoes || '';

            document.getElementById('txtHoraInicio').value = item.hora_inicio || '';
            document.getElementById('txtHoraFim').value = item.hora_fim || '';
            document.getElementById('tpNativoInicio').value = item.hora_inicio || '';
            document.getElementById('tpNativoFim').value = item.hora_fim || '';

            document.getElementById('lblMatriculaOperador').textContent = `Editando Nuvem ID: #${item.id}`;
        }

        // OnHoraTextChanged com máscara
        function onHoraInput(input) {
            let textoLimpo = input.value.replace(/\D/g, '');
            if (textoLimpo.length >= 3) {
                let formatado = textoLimpo.slice(0, 2) + ':' + textoLimpo.slice(2, 4);
                if (formatado.length > 5) formatado = formatado.substring(0, 5);
                input.value = formatado;
            } else {
                input.value = textoLimpo;
            }
        }

        function onTimePickerNativo(timeInput, targetTextId) {
            if (timeInput.value) {
                document.getElementById(targetTextId).value = timeInput.value;
            }
        }

        // OnSalvarApontamentoClicked
        async function onSalvarApontamentoClicked(e) {
            e.preventDefault();

            const executante = document.getElementById('txtMatriculaExecutante').value.trim();
            const hInicio = document.getElementById('txtHoraInicio').value.trim();
            const hFim = document.getElementById('txtHoraFim').value.trim();
            const os = document.getElementById('txtOrdemServico').value.trim(); // ÚNICO CAMPO OPCIONAL
            const setor = document.getElementById('pickerSetor').value.trim();
            const obs = document.getElementById('txtObservacoes').value.trim();
            const dataSql = document.getElementById('dpData').value;
            const grupoUsuario = (localStorage.getItem("UsuarioGrupo") || "Mantenedor").trim();
            const btnSalvar = document.getElementById('btnSalvar');

            // 1. Validação de Setor Obrigatório
            if (!setor) {
                alert("Campo Obrigatório: Por favor, selecione um Setor.");
                return;
            }

            // 2. Validação da Matrícula do Executante
            if (!executante) {
                alert("Campo Obrigatório: Por favor, informe a Matrícula do Executante.");
                return;
            }

            // 3. Validação dos Horários
            if (!hInicio || !hFim) {
                alert("Campos Obrigatórios: Os campos Hora Inicial e Hora Final são obrigatórios.");
                return;
            }

            const regexHora = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/;
            if (!regexHora.test(hInicio) || !regexHora.test(hFim)) {
                alert("Formato Inválido: Preencha os horários no formato HH:mm (Ex: 07:30).");
                return;
            }

            const [hIniH, hIniM] = hInicio.split(':').map(Number);
            const [hFimH, hFimM] = hFim.split(':').map(Number);
            const totalMinIni = hIniH * 60 + hIniM;
            const totalMinFim = hFimH * 60 + hFimM;

            if (totalMinFim <= totalMinIni) {
                alert("Horário Incoerente: A Hora Final deve ser posterior à Hora Inicial.");
                return;
            }

            // 4. Validação das Observações (Obrigatório conforme C#)
            if (!obs) {
                alert("Campo Obrigatório: Por favor, preencha o campo Observações.");
                return;
            }

            btnSalvar.disabled = true;

            try {
                // -----------------------------------------------------------
                // CENÁRIO 1: EDIÇÃO DIRETA NO SUPABASE (Origem: RelatorioPage)
                // -----------------------------------------------------------
                if (_apontamentoRemotoEdicao != null) {
                    if (!navigator.onLine) {
                        alert("Sem Conexão: Você precisa de conexão à internet para salvar as alterações na nuvem.");
                        return;
                    }

                    const { error } = await supabaseClient
                        .from('apontamentos')
                        .update({
                            ordem_servico: os,
                            setor: setor,
                            grupo: grupoUsuario,
                            matricula_executante: executante,
                            data: dataSql,
                            hora_inicio: hInicio,
                            hora_fim: hFim,
                            observacoes: obs
                        })
                        .eq('id', _apontamentoRemotoEdicao.id);

                    if (error) throw error;

                    _apontamentoRemotoEdicao.ordem_servico = os;
                    _apontamentoRemotoEdicao.setor = setor;
                    _apontamentoRemotoEdicao.grupo = grupoUsuario;
                    _apontamentoRemotoEdicao.matricula_executante = executante;
                    _apontamentoRemotoEdicao.data = dataSql;
                    _apontamentoRemotoEdicao.hora_inicio = hInicio;
                    _apontamentoRemotoEdicao.hora_fim = hFim;
                    _apontamentoRemotoEdicao.observacoes = obs;

                    // Tenta atualizar no banco local se houver registro com a mesma O.S.
                    try {
                        const locais = await LocalDB.obterApontamentosLocais();
                        const registroLocal = locais.find(x => x.ordem_servico === os);
                        if (registroLocal) {
                            registroLocal.setor = setor;
                            registroLocal.grupo = grupoUsuario;
                            registroLocal.matricula_executante = executante;
                            registroLocal.data = dataSql;
                            registroLocal.hora_inicio = hInicio;
                            registroLocal.hora_fim = hFim;
                            registroLocal.observacoes = obs;
                            await LocalDB.salvarApontamento(registroLocal);
                        }
                    } catch {
                        // Não interrompe o fluxo caso a busca local falhe
                    }

                    alert("Sucesso: Apontamento atualizado na nuvem com sucesso!");
                    window.location.href = "relatorios.html";
                    return;
                }

                // -----------------------------------------------------------
                // CENÁRIO 2: BANCO LOCAL SQLITE / INDEXEDDB (Novo ou Edição Local)
                // -----------------------------------------------------------
                const matriculaLogada = localStorage.getItem("MatriculaUsuario") || "---";

                if (_apontamentoEdicao == null) {
                    const novoApontamento = {
                        ordem_servico: os,
                        setor: setor,
                        grupo: grupoUsuario,
                        matricula_executante: executante,
                        matricula_usuario: matriculaLogada,
                        data: dataSql,
                        hora_inicio: hInicio,
                        hora_fim: hFim,
                        observacoes: obs,
                        data_sincronizado: null
                    };

                    await LocalDB.salvarApontamento(novoApontamento);
                    alert("Sucesso: Apontamento gravado com sucesso!");
                } else {
                    _apontamentoEdicao.ordem_servico = os;
                    _apontamentoEdicao.setor = setor;
                    _apontamentoEdicao.grupo = grupoUsuario;
                    _apontamentoEdicao.matricula_executante = executante;
                    _apontamentoEdicao.data = dataSql;
                    _apontamentoEdicao.hora_inicio = hInicio;
                    _apontamentoEdicao.hora_fim = hFim;
                    _apontamentoEdicao.observacoes = obs;
                    _apontamentoEdicao.data_sincronizado = null;

                    await LocalDB.salvarApontamento(_apontamentoEdicao);
                    alert("Sucesso: Apontamento atualizado com sucesso!");
                }

                window.location.href = "listaapontamento.html";
            } catch (ex) {
                console.error(ex);
                alert(`Erro: Falha ao salvar dados: ${ex.message || ex}`);
            } finally {
                btnSalvar.disabled = false;
            }
        }

        // OnVoltarTapped
        function onVoltarTapped() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "listaapontamento.html";
            }
        }
    </script>
</body>
</html>
